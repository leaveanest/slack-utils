name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
  pull_request_review_comment:
    types:
      - created

jobs:
  review:
    # PR作成・更新時、または @claude メンションがあった場合に実行
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pull_request_review_comment の場合はPRのHEADをチェックアウト
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          prompt: |
            このPRをレビューしてください。

            **重要**: レビューコメントは全て日本語で記述してください。

            ## Step 1: プロジェクトルールの確認
            まず以下のファイルを読んで、このプロジェクトのルールを理解してください：
            - `CLAUDE.md` - コーディング規約、i18n、テスト、例外処理のルール

            ## Step 2: レビュー観点
            CLAUDE.mdのルールに基づいて、以下の観点でレビューしてください：

            ### 必須チェック項目
            - [ ] **JSDoc**: 新しい公開関数にJSDocコメントがあるか
            - [ ] **テスト**: 新しい関数にテストファイルがあるか
            - [ ] **i18n**: エラーメッセージやユーザー向けメッセージが `t()` 関数でi18n化されているか
            - [ ] **バリデーション**: 入力値が Zod でバリデーションされているか
            - [ ] **例外処理**: API呼び出しで `response.ok` がチェックされているか
            - [ ] **型安全性**: TypeScriptの型が適切に定義されているか（暗黙的なanyがないか）

            ### 追加チェック項目
            - [ ] **セキュリティ**: 脆弱性がないか（インジェクション、XSSなど）
            - [ ] **パフォーマンス**: 明らかな非効率がないか

            ## Step 3: 出力形式
            - 問題がある場合は具体的な修正案を提示してください
            - チェック項目ごとに ✅ または ❌ で結果を示してください
            - 良い点があればコメントしてください
            - 全体的な評価を最後にまとめてください
          include_fix_links: true
