name: Issue to PR with Claude Code

on:
  issues:
    types:
      - labeled
      - assigned
  issue_comment:
    types:
      - created

jobs:
  implement_with_claude:
    # claude-ready ラベルが付与された場合、または @claude メンションがあった場合に実行
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'claude-ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          label_trigger: "claude-ready"
          branch_prefix: "claude/"
          prompt: |
            GitHub Issue #${{ github.event.issue.number }} を実装してください。

            ## Issue情報
            **タイトル**: ${{ github.event.issue.title }}

            **内容**:
            ${{ github.event.issue.body }}

            ## 作業指示
            1. CLAUDE.mdのルールに従ってコードを実装してください
            2. 必要に応じてテストを追加してください
            3. i18n対応が必要な場合は locales/en.json にメッセージを追加してください
            4. `deno task fmt` と `deno task lint` を実行して問題がないことを確認してください
            5. 実装が完了したらPRを作成してください

            ## コミットメッセージ
            feat: #${{ github.event.issue.number }} ${{ github.event.issue.title }}
          track_progress: true
